[project]
name = "mobile-starter"
version = "0.0.1"
description = "Mobile app starter - one Jac source, iOS + Android + web"
entry-point = "main.jac"
kind = "web-app"
client_kind = "mobui"

[serve]
base_route_app = "app"

[client]

[byllm]
[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"
api_key = "${OPENAI_API_KEY:-}"


[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"

[jacpack]
name = 'mig-plus-foundation'
description = 'Jac IDE snapshot for mig-plus-foundation'

[jachammer]
project_id = "prj_19236a4721334c31804095e4cb16f703"
